kind = "web"
previewPath = "/"
title = "Music Sync"
version = "1.0.0"
id = "artifacts/music-sync"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21104

[services.development]
run = "pnpm --filter @workspace/music-sync run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/music-sync", "run", "build" ]
publicDir = "artifacts/music-sync/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21104"
BASE_PATH = "/"
